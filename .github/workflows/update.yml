name: Refresh KBS TV Streams

on:
  # Allow manual runs
  workflow_dispatch:

  # Refresh every 2 hours
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-kbs-streams
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Refresh KBS streams
        run: python update.py

      - name: Show generated channels
        run: |
          echo "Generated channel files:"
          ls -lah channels/

      - name: Commit refreshed playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add channels/

          if git diff --cached --quiet; then
            echo "No playlist changes."
            exit 0
          fi

          git commit -m "Refresh KBS stream URLs"

          # Avoid failing if another commit landed while
          # this workflow was running.
          git pull --rebase origin "${GITHUB_REF_NAME}"

          git push origin "HEAD:${GITHUB_REF_NAME}"
