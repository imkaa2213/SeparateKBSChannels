name: Refresh KBS TV Streams

on:
  workflow_dispatch:

  schedule:
    # Every two hours at :17
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-kbs-tv-streams
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run KBS updater
        run: |
          python update.py

      - name: Show generated playlists
        if: always()
        run: |
          echo "Contents of channels directory:"
          ls -lah channels/ || true

      - name: Commit updated playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add channels/

          if git diff --cached --quiet; then
            echo "No playlist changes detected."
            exit 0
          fi

          git commit -m "Refresh KBS stream URLs"

          git pull --rebase origin "${GITHUB_REF_NAME}"

          git push origin "HEAD:${GITHUB_REF_NAME}"
