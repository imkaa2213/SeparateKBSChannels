name: Refresh KBS TV Streams

on:
  schedule:
    - cron: "17 */2 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Update KBS streams
        run: python update.py

      - name: Commit updated streams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add channels/

          if ! git diff --cached --quiet; then
            git commit -m "Refresh KBS TV streams"
            git push
          else
            echo "No changes"
          fi
